# Ein-Server-Betrieb auf einer Scaleway-Instanz (DEV1-M, 4 GB RAM): Caddy (TLS), App, Postgres, ClamAV.
# Dateien liegen im Scaleway Object Storage, Mails gehen über Scaleway Transactional Email.
# Konfiguration: deploy/scaleway.env.example nach .env kopieren und ausfüllen. Anleitung: docs/deploy-scaleway.md
# Start: docker compose -f docker-compose.scaleway.yml up -d --build
name: druckraum

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.0.2
    mem_limit: 128m
    depends_on:
      - app

  app:
    build:
      context: .
      args:
        APP_BASE_URL: https://${DOMAIN}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_PLAUSIBLE_SRC: ${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
    restart: unless-stopped
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      APP_BASE_URL: https://${DOMAIN}
      FIRM_INBOX: ${FIRM_INBOX}
      DATABASE_URL: postgres://dam:${POSTGRES_PASSWORD}@postgres:5432/dam
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.fr-par.scw.cloud}
      S3_REGION: ${S3_REGION:-fr-par}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "false"
      # Mail: Brevo-HTTP-API (BREVO_API_KEY gesetzt) oder SMTP; MAIL_TRANSPORT erzwingt einen.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MISTRAL_API_BASE: https://api.eu.mistral.ai/v1
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-3.5}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_TRUSTED_PROXIES: 172.30.0.2
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    command: sh -c "node db/migrate.js && node server.js"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dam
    command: postgres -c shared_buffers=128MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam"]
      interval: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable-debian
    restart: unless-stopped
    mem_limit: 2g
    volumes:
      - clamdb:/var/lib/clamav

volumes:
  pgdata:
  clamdb:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
