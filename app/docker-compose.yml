# Local stack: app + Postgres + MinIO (S3) + Mailpit (SMTP).
# Usage: docker compose up --build
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
      POSTGRES_DB: dam
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dam"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dam &&
      echo bucket-ready"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1026:1025"
      - "8026:8025"

  clamav:
    image: clamav/clamav:stable-debian
    ports:
      - "3311:3310"
    volumes:
      - clamdb:/var/lib/clamav

  app:
    build:
      context: .
      args:
        APP_BASE_URL: http://localhost:3100
    ports:
      - "3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      APP_BASE_URL: http://localhost:3100
      FIRM_INBOX: print@example.com
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-in-prod}
      BETTER_AUTH_URL: http://localhost:3100
      DATABASE_URL: postgres://dam:dam@postgres:5432/dam
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: dam
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM: DAM <dam@example.com>
      MISTRAL_API_BASE: https://api.eu.mistral.ai/v1
      MISTRAL_MODEL: mistral-medium-3.5
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    command: sh -c "node db/migrate.js && node server.js"

  # Batch-Virenscan (docs/virenscan.md), nur auf Anfrage: App mit CLAMAV_MODE=batch starten, dann
  #   docker compose --profile batch run --rm scan
  scan:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: Dockerfile.scan
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dam:dam@postgres:5432/dam
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: dam
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - clamscandb:/var/lib/clamav

volumes:
  pgdata:
  miniodata:
  clamdb:
  clamscandb:
