# freshclam für den Batch-Virenscan (Dockerfile.scan, docs/virenscan.md).
# Kein clamd (NotifyClamd fehlt bewusst), Log auf stdout, Signaturen auf dem Volume.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
LogTime yes
Foreground yes
Checks 0
